<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>TodoList</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Create navigation bar -->
<nav class="navbar fixed-top bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Todo List</a>
    </div>
</nav>

<br>
<br>

<div class="container">
    <div class="row">
        <h1>Todo-List</h1>
    </div>
    <form method="post" th:action="@{/add}" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="description" class="form-control" placeholder="New todo description" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Add Todo</button>
        </div>
    </form>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Actions</th>
            <th>Id</th>
            <th>Description</th>
            <th>Complete</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasklist}" th:class="${task.completed} ? 'success' : 'warning'">
            <td>
                <div class="btn btn-group-sm" role="group">
                    <a class="btn btn-info" th:href="@{/edit/{id}(id=${task.id})}">Edit</a>
                    <a class="btn btn-danger" th:href="@{/delete/{id}(id=${task.id})}">Delete</a>
                </div>
            </td>
            <td th:text="${task.id}">1</td>
            <td th:text="${task.description}">Finish the assesment</td>
            <td th:text="${task.completed}">true</td>

        </tr>
        </tbody>
    </table>
</div>

</div>


    <h1>********************</h1>
    <h1>To Do List Duzenlenecek</h1>
    <h1>********************</h1>
</body>
</html>
